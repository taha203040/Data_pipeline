services:
  grafana:
    image: grafana/grafana:latest
    container_name : grafana
    ports:
      - '3100:3100'
    # depends_on:
    #   - prometheus
  prometheus:
    image : prom/prometheus:latest
    container_name : 'prometheus'
    volumes:
      - ./prometheus.yml:/etc/prometheus.yml:ro
    ports:
      - '9090:9090'